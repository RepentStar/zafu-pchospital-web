<!doctype html>
<html lang="zh-CN">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <meta name="color-scheme" content="light" />
    <title>D 方案 · 后台筛选低保真预览</title>
    <style>
      :root {
        --bg: #f7f7f5;
        --surface: #fff;
        --ink: #242424;
        --muted: #595959;
        --line: #d4d4d0;
        --control: #858580;
        --accent: #303030;
        --on-accent: #fff;
        --wash: #e9e9e5;
        --radius: 4px;
      }
      * {
        box-sizing: border-box;
      }
      body {
        margin: 0;
        background: var(--bg);
        color: var(--ink);
        font:
          15px/1.6 system-ui,
          "Microsoft YaHei",
          sans-serif;
      }
      button,
      input,
      select {
        font: inherit;
        color: inherit;
      }
      button,
      input:not([type="checkbox"]),
      select {
        min-height: 46px;
        border: 1px solid var(--control);
        border-radius: var(--radius);
        background: var(--surface);
        padding: 8px 12px;
      }
      button {
        cursor: pointer;
      }
      button:hover {
        background: var(--wash);
      }
      button:disabled {
        cursor: default;
        opacity: 0.5;
      }
      :focus-visible {
        outline: 2px solid var(--accent);
        outline-offset: 3px;
      }
      [hidden] {
        display: none !important;
      }
      .primary {
        background: var(--accent);
        color: var(--on-accent);
      }
      .primary:hover {
        background: var(--ink);
      }
      .ghost {
        border-color: transparent;
        background: transparent;
      }
      .muted {
        color: var(--muted);
      }
      .bar,
      .actions {
        display: flex;
        align-items: center;
        flex-wrap: wrap;
        gap: 8px;
      }
      .bar {
        justify-content: space-between;
      }
      .prototype {
        padding: 16px max(16px, calc((100vw - 1120px) / 2));
        border-bottom: 1px dashed var(--control);
        background: var(--surface);
      }
      .prototype strong {
        display: block;
        font-size: 16px;
      }
      .prototype p {
        margin: 4px 0 12px;
      }
      .prototype label {
        display: flex;
        align-items: center;
        gap: 8px;
      }
      main {
        max-width: 1152px;
        margin: 32px auto;
        padding: 0 16px;
      }
      h1 {
        margin: 0 0 20px;
        font-size: 26px;
      }
      h2 {
        margin: 0;
        font-size: 20px;
      }
      .query {
        border-block: 1px solid var(--line);
        padding: 12px 0;
      }
      .tabs {
        display: flex;
        flex-wrap: wrap;
        gap: 4px;
      }
      .tabs button {
        border-color: transparent;
        background: transparent;
      }
      .tabs button[aria-pressed="true"] {
        border-bottom: 2px solid var(--accent);
        border-radius: 0;
        background: var(--wash);
        font-weight: 700;
      }
      .mobile-status {
        display: none;
      }
      .search {
        margin-top: 12px;
      }
      .search label {
        flex: 1 1 200px;
        max-width: 420px;
      }
      label > span {
        display: block;
        margin-bottom: 4px;
      }
      input:not([type="checkbox"]),
      select {
        width: 100%;
        min-width: 0;
      }
      .search .actions {
        margin-top: 4px;
      }
      .chips {
        display: flex;
        flex-wrap: wrap;
        align-items: center;
        gap: 8px;
        margin-top: 12px;
      }
      .chip {
        display: inline-flex;
        max-width: 100%;
        min-width: 0;
        border: 1px solid var(--control);
        border-radius: var(--radius);
        background: var(--surface);
      }
      .chip button {
        border: 0;
        background: transparent;
      }
      .chip .value {
        max-width: 250px;
        min-width: 0;
        overflow: hidden;
        text-overflow: ellipsis;
        white-space: nowrap;
      }
      .chip .remove {
        flex: 0 0 46px;
        border-left: 1px solid var(--line);
      }
      .meta {
        margin-top: 8px;
        font-size: 14px;
      }
      .tools {
        padding-block: 12px;
      }
      .feedback {
        margin: 0 0 12px;
        padding: 12px;
        border: 1px dashed var(--control);
        background: var(--surface);
      }
      .table-wrap {
        max-width: 100%;
        overflow: auto;
        border: 1px solid var(--line);
        background: var(--surface);
      }
      table {
        width: 100%;
        min-width: 760px;
        border-collapse: collapse;
        text-align: left;
      }
      th,
      td {
        padding: 13px 14px;
        border-bottom: 1px solid var(--line);
      }
      th {
        background: var(--wash);
        font-weight: 600;
      }
      td:first-child,
      th:first-child {
        width: 48px;
      }
      input[type="checkbox"] {
        width: 20px;
        height: 20px;
        accent-color: var(--accent);
      }
      .check {
        display: inline-flex;
        padding: 8px 0;
        align-items: center;
      }
      .badge {
        display: inline-block;
        padding: 2px 8px;
        border: 1px solid var(--control);
        border-radius: var(--radius);
        white-space: nowrap;
      }
      .empty {
        text-align: center;
        padding: 40px 16px;
      }
      .end {
        padding: 16px 0;
      }
      .note {
        border-top: 1px dashed var(--control);
        margin-top: 24px;
        padding-top: 16px;
        font-size: 14px;
      }
      dialog {
        padding: 0;
        width: min(500px, calc(100vw - 32px));
        max-height: calc(100dvh - 32px);
        border: 1px solid var(--control);
        border-radius: var(--radius);
        background: var(--surface);
        color: var(--ink);
      }
      dialog::backdrop {
        background: rgb(0 0 0 / 0.3);
      }
      dialog form {
        display: flex;
        flex-direction: column;
        max-height: calc(100dvh - 36px);
      }
      dialog header,
      dialog footer {
        padding: 16px 20px;
        flex-shrink: 0;
      }
      dialog header {
        border-bottom: 1px solid var(--line);
      }
      dialog footer {
        border-top: 1px solid var(--line);
        justify-content: flex-end;
      }
      .editor {
        padding: 20px;
        overflow: auto;
      }
      .editor > label {
        display: block;
        margin-bottom: 16px;
      }
      .editor label.check {
        display: flex;
        gap: 8px;
      }
      .full-value {
        white-space: pre-wrap;
        overflow-wrap: anywhere;
      }
      @media (max-width: 759px) {
        main {
          margin-top: 20px;
        }
        .tabs {
          display: none;
        }
        .mobile-status {
          display: block;
          flex: 1 1 100%;
        }
        .query > .bar > .actions {
          width: 100%;
        }
        .chip .value {
          max-width: calc(100vw - 102px);
        }
        .prototype .actions > label {
          width: 100%;
          flex-wrap: wrap;
        }
        .prototype select {
          flex: 1;
        }
        .search label {
          max-width: none;
          flex-basis: 100%;
        }
      }
    </style>
  </head>
  <body>
    <aside class="prototype" aria-label="预览控制台">
      <strong>D 方案已选定 · 独立低保真预览</strong>
      <p class="muted">状态先行，搜索与其他条件按需展开 · 全部为虚构数据 · 离线运行</p>
      <div class="actions">
        <label for="sample"
          >演示状态
          <select id="sample">
            <option value="default">默认</option>
            <option value="multiple">多个条件</option>
            <option value="draft">编辑未应用</option>
            <option value="long">长标签</option>
            <option value="empty">零结果</option>
            <option value="loading">刷新中（3 秒）</option>
            <option value="failure">失败保留旧结果</option>
          </select>
        </label>
        <label><input id="fail-next" type="checkbox" /> 下次请求失败</label>
      </div>
    </aside>
    <main>
      <h1>维修审核</h1>
      <section class="query" aria-label="查询工具">
        <div class="bar">
          <div id="tabs" class="tabs" role="group" aria-label="审核状态"></div>
          <label class="mobile-status" for="mobile-status"
            ><span>审核状态</span
            ><select id="mobile-status"></select
          ></label>
          <div class="actions">
            <button id="toggle-search" aria-expanded="false" aria-controls="search-form">
              搜索
            </button>
            <button id="more">更多筛选</button><button id="advanced" class="ghost">高级</button>
          </div>
        </div>
        <form id="search-form" class="search" hidden>
          <div class="actions">
            <label for="search"
              ><span>搜索维修记录</span
              ><input id="search" type="search" placeholder="设备、故障或提交人" autocomplete="off"
            /></label>
            <button type="submit">搜索</button>
          </div>
          <span id="search-dirty" class="muted" hidden>未应用</span>
        </form>
        <div id="chips" class="chips" aria-label="已提交条件" hidden></div>
        <div class="bar meta">
          <span id="query-meta" class="muted"></span
          ><button id="reset" class="ghost">重置查询</button>
        </div>
      </section>
      <div class="bar tools">
        <span id="total"></span>
        <div class="actions">
          <button id="batch" hidden>批量操作</button><button id="export">导出样例 CSV</button
          ><button id="refresh" class="ghost">刷新</button>
        </div>
      </div>
      <div id="feedback" class="feedback" role="status" aria-live="polite" hidden>
        <span id="message"></span> <button id="retry" hidden>重试</button>
      </div>
      <p id="groups" class="muted" hidden></p>
      <div class="table-wrap" tabindex="0" role="region" aria-label="维修审核样例列表，可横向滚动">
        <table>
          <thead>
            <tr>
              <th>
                <label class="check"
                  ><input id="select-all" type="checkbox" aria-label="选择当前已展示记录"
                /></label>
              </th>
              <th scope="col">设备 / 故障</th>
              <th scope="col">提交人</th>
              <th scope="col">分类</th>
              <th scope="col">状态</th>
              <th scope="col">维修日期</th>
            </tr>
          </thead>
          <tbody id="rows"></tbody>
        </table>
      </div>
      <div class="bar end">
        <span id="progress" class="muted"></span><button id="load">加载更多</button>
      </div>
      <p class="note muted">
        预览基于 cc9a2c6
        的维修场景，不连接业务接口。高级条件仅以日期示意；完整高级编辑器、权限、列宽与真实分页在正式接入时复用并验证。窄屏表格可在区域内横向滚动，正式实现沿用现有后台表格适配。
      </p>
      <noscript>请启用 JavaScript 体验筛选交互</noscript>
    </main>
    <dialog id="editor" aria-labelledby="editor-title">
      <form id="editor-form">
        <header><h2 id="editor-title"></h2></header>
        <div class="editor">
          <div id="quick-fields">
            <label for="category"
              ><span>分类</span
              ><select id="category">
                <option value="">全部</option>
                <option>软件问题</option>
                <option>硬件问题</option>
                <option>清灰维护</option>
              </select></label
            >
          </div>
          <div id="advanced-fields" hidden>
            <label for="date"><span>维修日期不早于</span><input id="date" type="date" /></label>
            <label for="sort"
              ><span>第一排序</span
              ><select id="sort">
                <option value="date">维修日期 ↓</option>
                <option value="name">设备 / 故障 ↑</option>
              </select></label
            >
            <label class="check"
              ><input id="secondary" type="checkbox" /> 第二排序：维修日期 ↓</label
            >
            <label class="check"><input id="group" type="checkbox" /> 按状态显示分组统计</label>
            <p class="muted">日期为列级条件示例，正式实现保留完整高级查询能力</p>
          </div>
          <p id="editor-dirty" class="muted" hidden>未应用 · 列表与摘要不变</p>
        </div>
        <footer class="actions">
          <button id="cancel" type="button" class="ghost">取消</button
          ><button type="submit" class="primary">应用</button>
        </footer>
      </form>
    </dialog>
    <dialog id="value-dialog" aria-labelledby="value-title">
      <form method="dialog">
        <header><h2 id="value-title">完整条件</h2></header>
        <div class="editor full-value" id="full-value"></div>
        <footer class="actions"><button>返回列表</button></footer>
      </form>
    </dialog>
    <script>
      "use strict";
      const $ = (id) => document.getElementById(id);
      const statuses = ["待审核", "已通过", "已退回", "草稿"];
      const categories = ["软件问题", "硬件问题", "清灰维护"];
      const names = [
        "林同学",
        "陈同学",
        "周同学",
        "林小雨",
        "王同学",
        "李同学",
        "吴同学",
        "郑同学",
        "许同学",
        "沈同学",
        "陆同学",
        "赵同学",
      ];
      const data = names.map((name, i) => ({
        id: i + 1,
        device: `笔记本 ${i + 1} / 无法启动`,
        name,
        category: categories[Math.floor(i / 2) % 3],
        status: statuses[i % 4],
        date: `2026-10-${String(28 - i).padStart(2, "0")}`,
      }));
      const defaults = () => ({
        search: "",
        status: "",
        category: "",
        date: "",
        sort: "date",
        secondary: false,
        group: false,
      });
      let query = defaults(),
        result = defaults(),
        timer,
        busy = false,
        failed = false;
      let selected = new Set(),
        limit = 8,
        expandedTags = false,
        editorKind,
        trigger;
      function button(text, action, className = "") {
        const el = document.createElement("button");
        el.type = "button";
        el.textContent = text;
        el.className = className;
        el.addEventListener("click", action);
        return el;
      }
      function matches(q) {
        return data
          .filter(
            (r) =>
              (!q.search ||
                [r.device, r.name, r.category, r.status].join(" ").includes(q.search)) &&
              (!q.status || q.status === r.status) &&
              (!q.category || q.category === r.category) &&
              (!q.date || r.date >= q.date),
          )
          .sort((a, b) =>
            q.sort === "name"
              ? a.device.localeCompare(b.device, "zh-CN") ||
                (q.secondary ? b.date.localeCompare(a.date) : 0)
              : b.date.localeCompare(a.date),
          );
      }
      function showMessage(text, retry = false) {
        $("feedback").hidden = !text;
        $("message").textContent = text;
        $("retry").hidden = !retry;
      }
      function request(next, delay = 550, forceFailure = false) {
        clearTimeout(timer);
        query = { ...next };
        busy = true;
        failed = false;
        const shouldFail = forceFailure || $("fail-next").checked;
        $("fail-next").checked = false;
        renderQuery();
        renderMeta();
        showMessage("刷新中 · 结果尚未更新，暂时保留上次列表与数量");
        timer = setTimeout(() => {
          busy = false;
          failed = shouldFail;
          if (failed) {
            showMessage("刷新失败 · 当前仍为上次结果与数量，请重试", true);
            renderMeta();
          } else {
            result = { ...query };
            selected.clear();
            limit = 8;
            renderResults();
            showMessage("");
          }
        }, delay);
      }
      function renderQuery() {
        document
          .querySelectorAll("#tabs button")
          .forEach((el) =>
            el.setAttribute("aria-pressed", String(el.dataset.value === query.status)),
          );
        $("mobile-status").value = query.status;
        $("query-meta").textContent =
          `排序：${query.sort === "date" ? "日期 ↓" : "设备 / 故障 ↑"}${query.secondary ? " → 日期 ↓" : ""}${query.group ? " · 分组：状态" : ""}`;
        const tags = [
          ["search", "搜索"],
          ["status", "状态"],
          ["category", "分类"],
          ["date", "高级 · 日期不早于"],
        ].filter(([key]) => query[key]);
        const chips = $("chips");
        chips.replaceChildren();
        chips.hidden = !tags.length;
        for (const [key, label] of expandedTags ? tags : tags.slice(0, 3)) {
          const full = `${label}：${query[key]}`;
          const chip = document.createElement("span");
          chip.className = "chip";
          const value = button(
            full,
            () => {
              $("full-value").textContent = full;
              $("value-dialog").showModal();
            },
            "value",
          );
          value.setAttribute("aria-label", `查看完整条件 ${full}`);
          const remove = button(
            "×",
            () => {
              if (key === "search") $("search").value = "";
              request({ ...query, [key]: "" });
              $("reset").focus();
            },
            "remove",
          );
          remove.setAttribute("aria-label", `移除 ${full}`);
          chip.append(value, remove);
          chips.append(chip);
        }
        if (tags.length > 3)
          chips.append(
            button(
              expandedTags ? "收起条件" : `其余 ${tags.length - 3} 项`,
              () => {
                expandedTags = !expandedTags;
                renderQuery();
                const toggle = chips.querySelector(".tag-toggle");
                toggle?.focus();
              },
              "ghost tag-toggle",
            ),
          );
        if (tags.length)
          chips.append(
            button(
              "清除筛选",
              () => {
                $("search").value = "";
                request({ ...query, search: "", status: "", category: "", date: "" });
                $("reset").focus();
              },
              "ghost",
            ),
          );
        $("search-dirty").hidden = $("search").value.trim() === query.search;
      }
      function renderMeta() {
        const rows = matches(result),
          stale = busy || failed;
        $("total").textContent =
          `${selected.size ? `已选 ${selected.size} 项 · ` : ""}共 ${rows.length} 条 · ${stale ? "上次结果 · " : ""}虚构样例`;
        $("batch").hidden = !selected.size;
        $("batch").disabled = stale;
        $("progress").textContent = `已展示 ${Math.min(limit, rows.length)} / ${rows.length} 条`;
        $("load").hidden = limit >= rows.length;
        $("load").disabled = stale;
        $("export").disabled = stale;
        $("select-all").checked =
          rows.slice(0, limit).length > 0 && rows.slice(0, limit).every((r) => selected.has(r.id));
        $("select-all").indeterminate = !$("select-all").checked && selected.size > 0;
        $("groups").hidden = !result.group;
        $("groups").textContent =
          `${stale ? "上次结果分组" : "分组统计"}：${statuses.map((s) => `${s} ${rows.filter((r) => r.status === s).length}`).join(" · ")}`;
      }
      function renderResults() {
        const body = $("rows");
        body.replaceChildren();
        const rows = matches(result).slice(0, limit);
        for (const r of rows) {
          const tr = document.createElement("tr"),
            td = document.createElement("td"),
            label = document.createElement("label"),
            cb = document.createElement("input");
          label.className = "check";
          cb.type = "checkbox";
          cb.checked = selected.has(r.id);
          cb.setAttribute("aria-label", `选择 ${r.device}`);
          cb.addEventListener("change", () => {
            cb.checked ? selected.add(r.id) : selected.delete(r.id);
            renderMeta();
          });
          label.append(cb);
          td.append(label);
          tr.append(td);
          for (const key of ["device", "name", "category", "status", "date"]) {
            const cell = document.createElement("td");
            if (key === "status") {
              const badge = document.createElement("span");
              badge.className = "badge";
              badge.textContent = r[key];
              cell.append(badge);
            } else cell.textContent = r[key];
            tr.append(cell);
          }
          body.append(tr);
        }
        if (!rows.length) {
          const tr = body.insertRow(),
            td = tr.insertCell();
          td.colSpan = 6;
          td.className = "empty";
          td.textContent = "没有符合条件的记录，可调整条件或清除筛选";
        }
        renderMeta();
      }
      function openEditor(kind) {
        trigger = document.activeElement;
        editorKind = kind;
        $("editor-title").textContent = kind === "quick" ? "更多筛选" : "高级查询";
        $("quick-fields").hidden = kind !== "quick";
        $("advanced-fields").hidden = kind !== "advanced";
        for (const key of ["category", "date", "sort"]) $(key).value = query[key];
        $("secondary").checked = query.secondary;
        $("group").checked = query.group;
        $("editor-dirty").hidden = true;
        $("editor").showModal();
      }
      function closeSearch() {
        $("search-form").hidden = true;
        $("toggle-search").setAttribute("aria-expanded", "false");
        $("toggle-search").focus();
      }
      for (const value of ["", ...statuses]) {
        const el = button(value || "全部", () => request({ ...query, status: value }));
        el.dataset.value = value;
        $("tabs").append(el);
        const opt = document.createElement("option");
        opt.value = value;
        opt.textContent = value || "全部";
        $("mobile-status").append(opt);
      }
      $("mobile-status").addEventListener("change", (e) =>
        request({ ...query, status: e.target.value }),
      );
      $("toggle-search").addEventListener("click", () => {
        if (!$("search-form").hidden) closeSearch();
        else {
          $("search-form").hidden = false;
          $("toggle-search").setAttribute("aria-expanded", "true");
          $("search").focus();
        }
      });
      $("search").addEventListener("input", () => {
        $("search-dirty").hidden = $("search").value.trim() === query.search;
      });
      $("search").addEventListener("keydown", (e) => {
        if (e.key === "Escape") closeSearch();
        if (e.key === "Enter" && e.isComposing) e.preventDefault();
      });
      $("search-form").addEventListener("submit", (e) => {
        e.preventDefault();
        request({ ...query, search: $("search").value.trim() });
      });
      $("more").addEventListener("click", () => openEditor("quick"));
      $("advanced").addEventListener("click", () => openEditor("advanced"));
      $("editor-form").addEventListener("input", () => {
        $("editor-dirty").hidden = false;
      });
      $("editor-form").addEventListener("submit", (e) => {
        e.preventDefault();
        const patch =
          editorKind === "quick"
            ? { category: $("category").value }
            : {
                date: $("date").value,
                sort: $("sort").value,
                secondary: $("secondary").checked,
                group: $("group").checked,
              };
        $("editor").close();
        request({ ...query, ...patch });
      });
      $("cancel").addEventListener("click", () => $("editor").close());
      $("editor").addEventListener("close", () => trigger?.focus());
      for (const id of ["editor", "value-dialog"]) {
        $(id).addEventListener("close", () => {
          document.body.style.overflow = "";
        });
      }
      const lock = new MutationObserver(() => {
        document.body.style.overflow = document.querySelector("dialog[open]") ? "hidden" : "";
      });
      document
        .querySelectorAll("dialog")
        .forEach((dialog) => lock.observe(dialog, { attributes: true, attributeFilter: ["open"] }));
      $("reset").addEventListener("click", () => {
        $("search").value = "";
        request(defaults());
      });
      $("refresh").addEventListener("click", () => request(query));
      $("retry").addEventListener("click", () => {
        $("refresh").focus();
        request(query);
      });
      $("select-all").addEventListener("change", (e) => {
        matches(result)
          .slice(0, limit)
          .forEach((r) => (e.target.checked ? selected.add(r.id) : selected.delete(r.id)));
        renderResults();
      });
      $("load").addEventListener("click", () => {
        limit += 8;
        renderResults();
        if ($("load").hidden) $("refresh").focus();
      });
      $("batch").addEventListener("click", () =>
        showMessage(`已选 ${selected.size} 条虚构记录 · 批量操作仅演示入口`),
      );
      $("export").addEventListener("click", () => {
        const rows = [
          ["设备 / 故障", "提交人", "分类", "状态", "维修日期"],
          ...matches(result).map((r) => [r.device, r.name, r.category, r.status, r.date]),
        ];
        const csv =
          "\uFEFF" +
          rows.map((row) => row.map((v) => `"${v.replaceAll('"', '""')}"`).join(",")).join("\r\n");
        const url = URL.createObjectURL(new Blob([csv], { type: "text/csv;charset=utf-8" }));
        const a = document.createElement("a");
        a.href = url;
        a.download = "D方案-虚构维修样例.csv";
        a.click();
        setTimeout(() => URL.revokeObjectURL(url), 1000);
      });
      $("sample").addEventListener("change", (e) => {
        clearTimeout(timer);
        busy = false;
        failed = false;
        selected.clear();
        limit = 8;
        expandedTags = false;
        $("fail-next").checked = false;
        query = defaults();
        result = defaults();
        $("search").value = "";
        $("search-form").hidden = true;
        $("toggle-search").setAttribute("aria-expanded", "false");
        showMessage("");
        const multi = {
          ...defaults(),
          search: "林",
          status: "待审核",
          category: "软件问题",
          sort: "name",
          secondary: true,
          group: true,
        };
        switch (e.target.value) {
          case "multiple":
            query = { ...multi };
            break;
          case "long":
            query = {
              ...multi,
              search: "林同学与维修志愿服务小组的超长查询内容，用于检查窄屏标签截断与完整值查看",
            };
            break;
          case "empty":
            query = { ...multi, date: "2027-01-01" };
            break;
          case "loading":
          case "failure":
            renderResults();
            request(multi, e.target.value === "loading" ? 3000 : 550, e.target.value === "failure");
            return;
        }
        result = { ...query };
        $("search").value = query.search;
        renderQuery();
        renderResults();
        if (e.target.value === "draft") {
          openEditor("quick");
          $("category").value = "软件问题";
          $("editor-dirty").hidden = false;
        }
      });
      renderQuery();
      renderResults();
    </script>
  </body>
</html>
