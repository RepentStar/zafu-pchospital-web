# 放入 pczafu.cn 的 HTTPS server {} 中，保留 server 级安全响应头。
# 路径必须与 DOCS_SYNC_APP_DIR 对应，修改后执行 nginx -t 再 reload。
# ^~ 防止其他静态资源正则 location 接管文档 CSS/JS；文档不转发给 Next.js。
location = /handbook {
    return 302 /handbook/;
}

location ^~ /handbook/ {
    root /opt/zafu-pchospital-web/public;
    index index.html;
    try_files $uri $uri/ =404;
    autoindex off;
    # 继承 http {} 中的 mime.types，确保 CSS/JS 不返回 application/octet-stream。
    expires -1;
    # 禁用继承的文件描述符缓存，目录替换后立即打开新版本。
    open_file_cache off;
}
